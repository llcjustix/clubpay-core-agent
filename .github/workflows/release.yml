name: Release ClubPay Windows clients

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows applications
        run: |
          dotnet publish src/ClubPay.Agent.Client/ClubPay.Agent.Client.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/ClubPay-Agent
          dotnet publish src/ClubPay.Agent.Admin/ClubPay.Agent.Admin.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/ClubPay-Manager
      - name: Package applications
        shell: pwsh
        run: |
          # Windows PowerShell 5 treats a UTF-8 script without BOM as an ANSI
          # file. Russian text then introduces quote-like bytes and the pilot
          # installer fails to parse on clean Windows images.
          Copy-Item -Path scripts/install-agent.cmd -Destination dist/ClubPay-Agent
          Get-Content -Path scripts/install-agent.ps1 -Raw | Set-Content -Path dist/ClubPay-Agent/install-agent.ps1 -Encoding utf8BOM
          Compress-Archive -Path dist/ClubPay-Agent/* -DestinationPath dist/ClubPay-Agent-win-x64.zip
          # One manager installation contains both the desktop UI and its local
          # fallback Controller. The Controller release is intentionally pulled
          # as a public, immutable artifact rather than duplicating its Go code.
          $controllerUrl = 'https://github.com/llcjustix/clubpay-platform/releases/download/controller-v0.2.3/ClubPay-Controller-win-x64.zip'
          Invoke-WebRequest -Uri $controllerUrl -OutFile dist/controller.zip
          Expand-Archive -Path dist/controller.zip -DestinationPath dist/controller-unpacked
          New-Item -ItemType Directory -Force -Path dist/ClubPay-Manager-Desktop | Out-Null
          Copy-Item -Path dist/ClubPay-Manager/* -Destination dist/ClubPay-Manager-Desktop -Recurse
          Move-Item -Path dist/controller-unpacked/ClubPay-Controller -Destination dist/ClubPay-Manager-Desktop/Controller
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"

          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )

          rem Install the local fallback first, then open the manager UI.
          rem Controller\install-windows.cmd asks for the one-time Manager
          rem Controller code from ClubPay Web Admin.
          call "%~dp0Controller\install-windows.cmd"
          if errorlevel 1 exit /b 1
          start "" "%~dp0ClubPay.Agent.Admin.exe"
          '@ | Set-Content -Path dist/ClubPay-Manager-Desktop/install-manager.cmd -Encoding ascii
          Compress-Archive -Path dist/ClubPay-Manager-Desktop/* -DestinationPath dist/ClubPay-Manager-Desktop-win-x64.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ClubPay-Agent-win-x64.zip
            dist/ClubPay-Manager-Desktop-win-x64.zip
