name: Build and test ClubPay Agent

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ClubPay.Agent.slnx
      - name: Test
        run: dotnet test ClubPay.Agent.slnx --configuration Release --no-restore
      - name: Build Agent
        run: dotnet build src/ClubPay.Agent.Client/ClubPay.Agent.Client.csproj --configuration Release --no-restore
      - name: Publish game PC Agent
        run: dotnet publish src/ClubPay.Agent.Client/ClubPay.Agent.Client.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/ClubPay-Agent
      - name: Publish Manager Client
        run: dotnet publish src/ClubPay.Agent.Admin/ClubPay.Agent.Admin.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/ClubPay-Manager
      - name: Package Windows clients
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Path scripts/install-agent.ps1 -Raw)) | Out-Null
          Copy-Item -Path scripts/install-agent.cmd -Destination dist/ClubPay-Agent
          Get-Content -Path scripts/install-agent.ps1 -Raw | Set-Content -Path dist/ClubPay-Agent/install-agent.ps1 -Encoding utf8BOM
          Copy-Item -Path scripts/clubpay-agent-enrollment.example.json -Destination dist/ClubPay-Agent
          Compress-Archive -Path dist/ClubPay-Agent/* -DestinationPath dist/ClubPay-Agent-win-x64.zip
          Compress-Archive -Path dist/ClubPay-Manager/* -DestinationPath dist/ClubPay-Manager-win-x64.zip
      - name: Upload Windows client packages
        uses: actions/upload-artifact@v4
        with:
          name: clubpay-windows-clients
          path: |
            dist/ClubPay-Agent-win-x64.zip
            dist/ClubPay-Manager-win-x64.zip
